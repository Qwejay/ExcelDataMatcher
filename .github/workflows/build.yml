name: Build and Package

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: '手动构建版本号 (例如: v1.2)'
        required: true
        default: 'v1.2'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install nuitka zstandard openpyxl pillow

    - name: Set Release Version
      shell: powershell
      run: |
        $ver = "${{ inputs.version }}"
        if (-not $ver) { $ver = "${{ github.ref_name }}" }
        Write-Host "Building version: $ver"
        echo "VERSION=$ver" >> $env:GITHUB_ENV

    - name: Build executable with Nuitka
      shell: powershell
      run: |
        $nuitkaArgs = @(
          "-m", "nuitka",
          "--standalone",
          "--onefile",
          "--assume-yes-for-downloads",
          "--windows-console-mode=disable",
          "--enable-plugin=tk-inter",
          "--include-package=pandas",
          "--include-package=ttkbootstrap",
          "--include-package=openpyxl",
          "--output-filename=ExcelDataMatcher_$env:VERSION.exe"
        )

        if (Test-Path "logo.ico") {
            Write-Host "Found logo.ico, attaching icon to build..."
            $nuitkaArgs += "--include-data-file=logo.ico=logo.ico"
            $nuitkaArgs += "--windows-icon-from-ico=logo.ico"
        } else {
            Write-Host "WARNING: logo.ico not found in root folder! Skipping icon to prevent build failure."
        }

        $nuitkaArgs += "main.py"
        python @nuitkaArgs

    - name: List built executables
      run: Get-ChildItem -Recurse -Filter "*.exe"

    - name: Create Zip Archive
      shell: powershell
      run: |
        $exeFile = Get-ChildItem -Path . -Recurse -Filter "*.exe" | Where-Object { $_.Name -like "*ExcelDataMatcher*" -and $_.FullName -notlike "*\site-packages\*" } | Select-Object -First 1
        
        if ($exeFile) {
            Write-Host "Found executable at: $($exeFile.FullName)"
            Compress-Archive -Path $exeFile.FullName -DestinationPath "ExcelDataMatcher_$env:VERSION.zip"
        } else {
            Write-Error "Error: No matching executable file found!"
            exit 1
        }

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ExcelDataMatcher_${{ env.VERSION }}-zip
        path: ExcelDataMatcher_${{ env.VERSION }}.zip

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.VERSION }}
        files: ExcelDataMatcher_${{ env.VERSION }}.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}